<script>
// Keep the clickable village areas lined up when the map is scaled to fit the screen.
(function () {
    var img = document.getElementById('met-map');
    var areas = document.querySelectorAll('map[name="image-map"] area');
    var original = [];
    for (var i = 0; i < areas.length; i++) original.push(areas[i].getAttribute('coords'));
    function scale() {
        var ratio = img.clientWidth / (img.naturalWidth || 1320);
        for (var i = 0; i < areas.length; i++) {
            if (!original[i]) continue;
            areas[i].setAttribute('coords', original[i].split(',').map(function (n) {
                return Math.round(parseFloat(n) * ratio);
            }).join(','));
        }
    }
    if (img.complete) scale(); else img.addEventListener('load', scale);
    window.addEventListener('resize', scale);
})();
</script>
