<!DOCTYPE HTML>
<html lang="en-uk">
<head>
    <title>MET Slideshow</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="../assets/css/slideshow.css" />
    <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
</head>
<body>
<div class="container">

    <div data-am-fadeshow="next-prev-navigation autoplay">

        <!-- Radio -->
        <input type="radio" name="css-fadeshow" id="slide-1" />
        <input type="radio" name="css-fadeshow" id="slide-2" />
        <input type="radio" name="css-fadeshow" id="slide-3" />
        <input type="radio" name="css-fadeshow" id="slide-4" />
        <input type="radio" name="css-fadeshow" id="slide-5" />
        <input type="radio" name="css-fadeshow" id="slide-6" />
        <input type="radio" name="css-fadeshow" id="slide-7" />
        <input type="radio" name="css-fadeshow" id="slide-8" />
        <input type="radio" name="css-fadeshow" id="slide-9" />
        <input type="radio" name="css-fadeshow" id="slide-10" />
        <input type="radio" name="css-fadeshow" id="slide-11" />
        <input type="radio" name="css-fadeshow" id="slide-12" />
        <input type="radio" name="css-fadeshow" id="slide-13" />
        <input type="radio" name="css-fadeshow" id="slide-14" />
        <input type="radio" name="css-fadeshow" id="slide-15" />

        <!-- Slides -->
        <div class="fs-slides">
            <div class="fs-slide" style="background-image: url(../images/loopmet/image144.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image2.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image3.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image4.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image5.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image6.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image7.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image8.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image9.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image10.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image11.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image12.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image13.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image17.jpeg);"></div>
            <div class="fs-slide" style="background-image: url(../images/loopmet/image25.jpeg);"></div>
        </div>

        <!-- Quick Navigation -->
        <div class="fs-quick-nav">
            <label class="fs-quick-btn" for="slide-1"></label>
            <label class="fs-quick-btn" for="slide-2"></label>
            <label class="fs-quick-btn" for="slide-3"></label>
            <label class="fs-quick-btn" for="slide-4"></label>
            <label class="fs-quick-btn" for="slide-5"></label>
            <label class="fs-quick-btn" for="slide-6"></label>
            <label class="fs-quick-btn" for="slide-7"></label>
            <label class="fs-quick-btn" for="slide-8"></label>
            <label class="fs-quick-btn" for="slide-9"></label>
            <label class="fs-quick-btn" for="slide-10"></label>
            <label class="fs-quick-btn" for="slide-11"></label>
            <label class="fs-quick-btn" for="slide-12"></label>
            <label class="fs-quick-btn" for="slide-13"></label>
            <label class="fs-quick-btn" for="slide-14"></label>
            <label class="fs-quick-btn" for="slide-15"></label>
        </div>

        <!-- Prev Navigation -->
        <div class="fs-prev-nav">
            <label class="fs-prev-btn" for="slide-1"></label>
            <label class="fs-prev-btn" for="slide-2"></label>
            <label class="fs-prev-btn" for="slide-3"></label>
            <label class="fs-prev-btn" for="slide-4"></label>
            <label class="fs-prev-btn" for="slide-5"></label>
            <label class="fs-prev-btn" for="slide-6"></label>
            <label class="fs-prev-btn" for="slide-7"></label>
            <label class="fs-prev-btn" for="slide-8"></label>
            <label class="fs-prev-btn" for="slide-9"></label>
            <label class="fs-prev-btn" for="slide-10"></label>
            <label class="fs-prev-btn" for="slide-11"></label>
            <label class="fs-prev-btn" for="slide-12"></label>
            <label class="fs-prev-btn" for="slide-13"></label>
            <label class="fs-prev-btn" for="slide-14"></label>
            <label class="fs-prev-btn" for="slide-15"></label>
        </div>

        <!-- Next Navigation -->
        <div class="fs-next-nav">
            <label class="fs-next-btn" for="slide-1"></label>
            <label class="fs-next-btn" for="slide-2"></label>
            <label class="fs-next-btn" for="slide-3"></label>
            <label class="fs-next-btn" for="slide-4"></label>
            <label class="fs-next-btn" for="slide-5"></label>
            <label class="fs-next-btn" for="slide-6"></label>
            <label class="fs-next-btn" for="slide-7"></label>
            <label class="fs-next-btn" for="slide-8"></label>
            <label class="fs-next-btn" for="slide-9"></label>
            <label class="fs-next-btn" for="slide-10"></label>
            <label class="fs-next-btn" for="slide-11"></label>
            <label class="fs-next-btn" for="slide-12"></label>
            <label class="fs-next-btn" for="slide-13"></label>
            <label class="fs-next-btn" for="slide-14"></label>
            <label class="fs-next-btn" for="slide-15"></label>
        </div>

    </div>

</div>
</body>
</html>
